<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Geofence Policy Map</title>
  <link rel="stylesheet" href="geofence-native-map.css">
</head>
<body>
  <section class="native-map-panel">
    <p class="eyebrow">GEOFENCE POLICY MONITOR</p>
    <h1>Policy map</h1>
    <p class="intro">Select a policy to draw its Geotab zone and monitored vehicle positions on this native MyGeotab map.</p>
    <label for="native-policy-select">Created policy</label>
    <select id="native-policy-select">
      <option value="">Loading policies…</option>
    </select>
    <button id="native-policy-refresh" type="button">Refresh policies and positions</button>
    <div class="legend">
      <span><i class="dot compliant"></i>Compliant</span>
      <span><i class="dot trigger"></i>Spatial trigger</span>
    </div>
    <p id="native-map-status" class="status" role="status">Connecting to the MyGeotab map services.</p>
  </section>
  <script src="geofence-native-map.js"></script>
</body>
</html>
